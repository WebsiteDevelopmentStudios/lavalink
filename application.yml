server:
  address: 0.0.0.0
  port: 2333

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:change-this-password}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    opusEncodingQuality: 10
    resamplingQuality: LOW
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
  plugins:
    youtube:
      enabled: true
      allowSearch: true
      allowDirectVideoIds: true
      clients:
        - MUSIC
        - WEB
        - WEBEMBEDDED

plugins:
  - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
    repository: "https://maven.lavalink.dev/releases"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
